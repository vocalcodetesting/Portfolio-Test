<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A small static site used to test GitHub and Vercel portfolio integrations.">
    <title>Portfolio Test</title>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #07080a; color: #f7f7f8; }
      main { width: min(680px, calc(100% - 40px)); padding: clamp(32px, 7vw, 72px); border: 1px solid #ffffff20; border-radius: 24px; background: linear-gradient(145deg, #12151a, #090a0d); box-shadow: 0 28px 90px #0008; }
      p:first-child { color: #7cffaa; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 18px 0; font-size: clamp(48px, 10vw, 88px); line-height: .95; letter-spacing: -.06em; }
      p:last-child { max-width: 44ch; color: #b8bac2; font-size: 17px; line-height: 1.65; }
    </style>
  </head>
  <body>
    <main>
      <p>GitHub + Vercel test</p>
      <h1>Portfolio Test</h1>
      <p>This static page verifies that a public GitHub repository can be connected to Vercel and represented inside the portfolio.</p>
    </main>
  </body>
</html>
